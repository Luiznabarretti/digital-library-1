<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacidade (LGPD)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h3 class="fw-bold mb-3">Meus direitos (LGPD)</h3>
    <p class="text-muted">Titular: <span th:text="${user.email}"></span></p>
    <div class="list-group mb-4">
        <a th:href="@{/privacy/my-data}" class="list-group-item list-group-item-action">Consultar meus dados</a>
        <a th:href="@{/privacy/export}" class="list-group-item list-group-item-action">Exportar meus dados (JSON)</a>
        <a th:href="@{/privacy/consents}" class="list-group-item list-group-item-action">Histórico e revogação de consentimento</a>
    </div>
    <form th:action="@{/privacy/delete}" method="post" onsubmit="return confirm('Excluir/anonimizar seus dados?');">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-outline-danger">Solicitar exclusão dos dados</button>
    </form>
    <a th:href="@{/dashboard}" class="btn btn-link mt-3">Voltar</a>
</div>
</body>
</html>
