<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consentimentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h3>Histórico de consentimentos</h3>
    <div th:if="${param.revoked}" class="alert alert-success">Consentimento revogado com sucesso.</div>
    <table class="table table-sm bg-white">
        <thead>
        <tr><th>Finalidade</th><th>Versão</th><th>Concedido</th><th>Data</th><th>IP</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${consents}">
            <td th:text="${c.purpose}"></td>
            <td th:text="${c.termVersion}"></td>
            <td th:text="${c.granted}"></td>
            <td th:text="${c.grantedAt}"></td>
            <td th:text="${c.ipAddress}"></td>
        </tr>
        </tbody>
    </table>
    <form th:action="@{/privacy/consent/revoke}" method="post" class="mt-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-warning">Revogar consentimento da conta</button>
    </form>
    <a th:href="@{/privacy}" class="btn btn-link">Voltar</a>
</div>
</body>
</html>
