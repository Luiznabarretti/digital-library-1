<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Autenticador 2FA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3 p-4 text-center">
                <h4 class="fw-bold">Ative o 2FA (TOTP)</h4>
                <p class="text-muted small">
                    No Microsoft Authenticator: adicione conta → <strong>escanear QR code</strong>.
                    Remova qualquer conta antiga deste app antes de escanear.
                </p>
                <p class="small"><strong th:text="${email}">email</strong></p>
                <img th:src="${qrCode}" alt="QR Code TOTP" class="img-fluid mx-auto my-3" style="max-width: 220px;"/>
                <p class="small text-muted mb-1">Se o QR falhar, adicione a conta com esta chave (entrada manual):</p>
                <code class="user-select-all d-block mb-2" th:text="${totpSecret}">SECRET</code>
                <p class="small text-muted">Tipo: baseada em tempo (TOTP) · 6 dígitos</p>
                <div class="d-grid mt-3">
                    <a th:href="@{/login}" class="btn btn-primary">Já configurei — Ir para o Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
